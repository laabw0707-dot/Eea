<script>
'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
/* ===== رفيق الدراسة الطبي ===== */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const SCP=['#c9a44c','#2f9a82','#d0634f','#5b8def','#9b6bd1','#e08a3c','#4aa3b5','#a8557a','#7a9a3a'];const sc=n=>SCP[[...String(n||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%SCP.length];const sty=n=>n?`background:${sc(n)}33;border:1px solid ${sc(n)}`:'';
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const DEF_SUBJ=['التشريح','علم وظائف الأعضاء','الكيمياء الحيوية','علم الأنسجة','علم الأحياء المجهرية','علم الأدوية','علم الأمراض','الباطنية','الجراحة'];

/* ---------- التخزين ---------- */
let S;
let first=false;
const load=()=>{try{S=JSON.parse(localStorage.getItem('mc')||'null')}catch(e){S=null}
 first=!S;
 S=Object.assign({subjects:DEF_SUBJ.slice(),tasks:[],exams:[],sched:[],notes:{},cards:[],grades:[],pdfs:[],pos:{},bm:{},theme:'auto',sound:true,pomo:{}},S||{});if(!first)return;const id=()=>uid();S.tasks.push({id:id(),name:'(مثال) تلخيص فصل القلب والأوعية',subj:'علم وظائف الأعضاء',due:'',done:false});S.exams.push({id:id(),name:'(مثال) امتحان التشريح النصفي',subj:'التشريح',date:iso(14)});S.sched.push({id:id(),day:'الأحد',time:'08:00',subj:'التشريح',room:'(مثال) قاعة 3'});S.cards.push({id:id(),subj:'التشريح',q:'(مثال) ما العصب الذي يعصّب العضلة الدالية؟',a:'العصب الإبطي (C5–C6)',box:1,due:iso(0)})};
const save=()=>{try{localStorage.setItem('mc',JSON.stringify(S))}catch(e){toast('تعذّر الحفظ: التخزين ممتلئ')}};
load();
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('mcpdf',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbOp=async(mode,fn)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const putF=(k,b)=>idbOp('readwrite',s=>s.put(b,k));
const getF=k=>idbOp('readonly',s=>s.get(k));
const delF=k=>idbOp('readwrite',s=>s.delete(k));
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const subjOpts=(sel)=>'<option value="">— بدون مادة —</option>'+S.subjects.map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('');
const dleft=d=>Math.ceil((new Date(d+'T00:00')-new Date(new Date().toDateString()))/864e5);
const today=()=>iso(0);

/* ---------- التنقل ---------- */
const ICON={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',pdfs:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/>',notes:'<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/>',cards:'<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/>',sched:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',tasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',exams:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>',pomo:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',gpa:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>',son:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',soff:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>',logo:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M12 8v8M8 12h8"/>'};
const ic=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>';
const PAGES=[['home','home','الرئيسية'],['pdfs','pdfs','الملازم'],['notes','notes','الملاحظات'],['cards','cards','البطاقات'],['sched','sched','الجدول'],['tasks','tasks','الواجبات'],['exams','exams','الامتحانات'],['pomo','pomo','المؤقت'],['gpa','gpa','المعدل']];
let page=localStorage.getItem('mcpage')||'home';
function nav(){$('#nav').innerHTML='<i id="ind"></i><h1><img class="lg" alt="" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 130 130%22%3E%3Crect width=%22130%22 height=%22130%22 rx=%2230%22 fill=%22%230f5a48%22/%3E%3Cpath d=%22M65 18L106 32V64C106 88 88 102 65 110C42 102 24 88 24 64V32Z%22 fill=%22%2317806a%22 stroke=%22%23e3be6a%22 stroke-width=%223%22 stroke-linejoin=%22round%22/%3E%3Crect x=%2257%22 y=%2242%22 width=%2216%22 height=%2244%22 rx=%223%22 fill=%22%23e3be6a%22/%3E%3Crect x=%2243%22 y=%2256%22 width=%2244%22 height=%2216%22 rx=%223%22 fill=%22%23e3be6a%22/%3E%3Cpath d=%22M95 38C95.5 43 97 44.5 102 46C97 47.5 95.5 49 95 54C94.5 49 93 47.5 88 46C93 44.5 94.5 43 95 38Z%22 fill=%22%23f1d89a%22/%3E%3Cpath d=%22M121 98V108C121 119 113 125 102 125H90%22 fill=%22none%22 stroke=%22%23f1d89a%22 stroke-width=%226.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">'+'<span>رفيق</span></h1>'+PAGES.map(p=>`<button data-go="${p[0]}" class="${p[0]===page?'on':''}">${ic(p[1])} <span>${p[2]}</span></button>`).join('')+'<div class="sp"></div><button data-a="sound">'+ic(S.sound?'son':'soff')+' <span>الصوت</span></button><button data-a="theme">'+ic('moon')+' <span>الوضع</span></button>';mv(0)}
function mv(a){const i=$('#ind'),b=$('#nav button.on');if(!i||!b)return;if(!a)i.style.transition='none';i.style.height=b.offsetHeight+'px';i.style.transform='translateY('+b.offsetTop+'px)';if(!a){void i.offsetWidth;i.style.transition=''}}

/* ---------- الصفحات ---------- */
const V={},AFTER={};
let notesSubj=null,cardTab='study',pdfFilter='',cardIdx=0,cardFlip=false,cfl=false;

V.home=()=>{
 const open=S.tasks.filter(t=>!t.done).length;
 const ex=S.exams.filter(e=>dleft(e.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0];

 const last=S.pdfs.find(p=>p.id===S.lastPdf);
 return `${sbar()}<h2>أهلًا بك</h2><div class="grid">
 <div class="card"><h3>${ic('exams')}أقرب امتحان</h3>${ex?`<div class="big">${dleft(ex.date)} <span class="mut">يوم</span></div><div>${esc(ex.name)}${ex.time?' ⏰ '+esc(ex.time):''} <span class="mut">${esc(ex.subj||'')}</span></div>`:'<div class="mut">لا توجد امتحانات</div>'}</div>
 <div class="card"><h3>${ic('tasks')}واجبات متبقية</h3><div class="big">${open}</div></div>
 <div class="card"><h3>${ic('cards')}بطاقات للمراجعة اليوم</h3><div class="big">${due}</div>${due?'<button class="b sm" data-go="cards">راجع الآن</button>':''}</div>
 <div class="card"><h3>${ic('pomo')}جلسات التركيز اليوم</h3><div class="big">${S.pomo[today()]||0}</div></div>${extra()}

 <div class="card"><h3>${ic('pdfs')}تابع القراءة</h3>${last?`<div>${esc(last.name)}</div><div class="mut">صفحة ${(S.pos[last.id]||{}).page||1}</div><button class="b sm" data-a="openpdf" data-id="${last.id}">متابعة</button>`:'<div class="mut">أضف ملزمة من قسم الملازم</div>'}</div>
 </div>
 ${bkCard()}`};

/* الملازم */
V.pdfs=()=>{
 const list=S.pdfs.filter(p=>!pdfFilter||p.subj===pdfFilter);

let AC,RV,LP={x:innerWidth/2,y:innerHeight/2};
const actx=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}};
function verb(a){if(RV)return RV;const n=a.sampleRate*1.8,b=a.createBuffer(2,n,a.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.4)}const cv=a.createConvolver();cv.buffer=b;const g=a.createGain();g.gain.value=.3;cv.connect(g);g.connect(a.destination);return RV=cv}
function bell(f,d,v,t0){if(!S.sound)return;const a=actx();if(!a)return;const t=a.currentTime+(t0||0),out=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;out.connect(lp);lp.connect(a.destination);lp.connect(verb(a));
 [[1,1],[2,.1]].forEach(([m,k])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v*k,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05)})}
const sTick=()=>bell(440,.25,.008),sLow=()=>bell(220,.9,.03),sOpen=()=>{bell(330,1.2,.022);bell(494,1.4,.018,.14)},
 sOk=()=>{bell(392,1.6,.026);bell(523.25,1.8,.022,.15);bell(659.25,2.2,.018,.3)},sDone=()=>{bell(523.25,1.2,.06);bell(659.25,1.2,.055,.1);bell(783.99,1.8,.05,.2)},sDel=()=>{bell(330,.5,.06);bell(196,.9,.055,.12)};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function burst(x,y){for(let i=0;i<12;i++){const p=document.createElement('i'),a=Math.PI*2*i/12+Math.random()*.5,r=34+Math.random()*34;p.className='spk';p.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),900)}}
const fx=k=>{if(/^(add|cok$|restore$)/.test(k)){sOk();burst(LP.x,LP.y);buzz([10,40,10])}else if(/^(del(?!task)|cno$)/.test(k)){sLow();buzz(20)}};
document.addEventListener('pointerdown',e=>{LP={x:e.clientX,y:e.clientY};const t=e.target.closest('button,.b,[data-a],[data-go],.fc,.item');if(!t||t.disabled)return;sTick();buzz(6);
